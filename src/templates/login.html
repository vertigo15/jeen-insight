<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', stored || 'light');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Jeen Insights</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600&family=Urbanist:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=83">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg);
      font-family: var(--font-sans);
      min-height: 100vh;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 24px 16px;
    }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 40px 36px 36px;
      box-shadow: var(--shadow-md);
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
      background: var(--btn-primary-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--btn-primary-fg);
      letter-spacing: 0;
      font-family: var(--font-sans);
      flex-shrink: 0;
    }
    .login-title {
      font-size: var(--text-xl);
      font-weight: var(--weight-medium);
      color: var(--color-text);
      margin: 0;
      letter-spacing: 0;
      text-align: center;
      line-height: 1.2;
    }
    .login-subtitle {
      font-size: var(--text-base);
      color: var(--color-muted);
      margin: 4px 0 0;
      text-align: center;
    }

    .login-error {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--color-error-bg);
      border: 1px solid color-mix(in srgb, var(--color-error) 35%, var(--color-border));
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 20px;
      font-size: var(--text-base);
      color: var(--color-error);
    }

    .login-form { display: flex; flex-direction: column; gap: 16px; }

    .login-field { display: flex; flex-direction: column; gap: 6px; }
    .login-label {
      font-size: var(--text-base);
      font-weight: var(--weight-medium);
      color: var(--color-text);
    }
    .login-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-sizing: border-box;
      height: 40px;
    }
    .login-input:focus {
      border-color: var(--color-text);
      box-shadow: var(--shadow-focus);
    }
    .login-input::placeholder { color: var(--color-muted); }

    .login-pw-wrap { position: relative; }
    .login-pw-wrap .login-input { padding-right: 40px; }
    .login-pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      height: auto;
      border-radius: var(--radius-pill);
    }
    .login-pw-toggle:hover { color: var(--color-text); }

    .login-btn {
      width: 100%;
      height: 40px;
      padding: 8px 16px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }
    .login-btn:hover { background: var(--btn-primary-hover); }
    .login-btn:active { background: var(--btn-primary-active); }
    .login-btn:disabled {
      background: var(--btn-primary-disabled);
      color: var(--color-subtle);
      cursor: default;
    }

    .btn-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: var(--btn-primary-fg);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0;
      color: var(--color-muted);
      font-size: 12px;
    }
    .login-divider::before,
    .login-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .login-ms-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 40px;
      padding: 8px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-pill);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      box-sizing: border-box;
    }
    .login-ms-btn:hover {
      background: var(--color-surface-2);
      border-color: var(--color-muted);
    }
    .login-ms-mark {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">

      <!-- Brand -->
      <div class="login-brand">
        <div class="login-logo">J</div>
        <div>
          <h1 class="login-title">Jeen Insights</h1>
          <p class="login-subtitle">Sign in to your workspace</p>
        </div>
      </div>

      <!-- Error banner (only shown on failed attempt) -->
      {% if error %}
      <div class="login-error" role="alert">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <!-- Form -->
      {% if entra_sso_enabled %}
      <a
        class="login-ms-btn"
        href="{{ url_for('microsoft_login', next=request.args.get('next', '/')) }}"
        id="microsoft-login-btn"
      >
        <svg class="login-ms-mark" viewBox="0 0 21 21" aria-hidden="true">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        Sign in with Microsoft
      </a>

      <div class="login-divider" aria-hidden="true">or</div>
      {% endif %}

      <form class="login-form" method="POST" action="/login" id="login-form">
        <!-- CSRF token (validated by Flask-WTF) -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <!-- Preserve redirect target -->
        <input type="hidden" name="next" value="{{ request.args.get('next', '/') }}">

        <div class="login-field">
          <label class="login-label" for="email">Email / username</label>
          <input
            id="email"
            name="email"
            type="text"
            class="login-input"
            placeholder="admin"
            autocomplete="username"
            autofocus
            required
            value="{{ request.form.get('email', '') }}"
          >
        </div>

        <div class="login-field">
          <label class="login-label" for="password">Password</label>
          <div class="login-pw-wrap">
            <input
              id="password"
              name="password"
              type="password"
              class="login-input"
              placeholder="••••••"
              autocomplete="current-password"
              required
            >
            <button type="button" class="login-pw-toggle" id="pw-toggle"
                    aria-label="Toggle password visibility" tabindex="-1">
              <svg id="pw-icon-show" width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="pw-icon-hide" width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="login-btn">Sign in with password</button>
      </form>
    </div>
  </div>

  <script>
    // Show/hide password toggle
    const pwInput   = document.getElementById('password');
    const toggle    = document.getElementById('pw-toggle');
    const iconShow  = document.getElementById('pw-icon-show');
    const iconHide  = document.getElementById('pw-icon-hide');
    toggle.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      iconShow.style.display = show ? 'none' : '';
      iconHide.style.display = show ? '' : 'none';
    });

    // Show spinner on submit
    document.getElementById('login-form').addEventListener('submit', () => {
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner"></span>Signing in…';
    });
  </script>
</body>
</html>
