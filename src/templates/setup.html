<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', stored || 'light');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First-run setup — Jeen Insights</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600&family=Urbanist:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=83">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--color-bg);
      font-family: var(--font-sans);
      min-height: 100vh;
    }
    .login-wrap { width: 100%; max-width: 420px; padding: 24px 16px; }
    .login-card {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); padding: 40px 36px 36px; box-shadow: var(--shadow-md);
    }
    .login-brand { display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:24px; }
    .login-logo {
      width:48px; height:48px; border-radius: var(--radius-lg); background: var(--btn-primary-bg);
      display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color: var(--btn-primary-fg);
    }
    .login-title { font-size: var(--text-xl); font-weight: var(--weight-medium); color:var(--color-text); margin:0; text-align:center; line-height:1.2; }
    .login-subtitle { font-size: var(--text-base); color:var(--color-muted); margin:4px 0 0; text-align:center; }
    .login-error {
      display:flex; align-items:center; gap:8px; background: var(--color-error-bg);
      border:1px solid color-mix(in srgb, var(--color-error) 35%, var(--color-border)); border-radius: var(--radius-md); padding:10px 12px;
      margin-bottom:20px; font-size: var(--text-base); color: var(--color-error);
    }
    .login-form { display:flex; flex-direction:column; gap:16px; }
    .login-field { display:flex; flex-direction:column; gap:6px; }
    .login-label { font-size: var(--text-base); font-weight:500; color:var(--color-text); }
    .login-input {
      width:100%; padding:10px 12px; font-size:14px; font-family:inherit; border:1px solid var(--color-border);
      border-radius: var(--radius-md); background: var(--color-surface); color:var(--color-text);
      outline:none; box-sizing:border-box; height:40px;
    }
    .login-input:focus { border-color: var(--color-text); box-shadow: var(--shadow-focus); }
    .login-btn {
      width:100%; height:40px; padding:8px 16px; border:none; border-radius: var(--radius-pill); background: var(--btn-primary-bg);
      color: var(--btn-primary-fg); font-size:14px; font-weight:500; font-family:inherit; cursor:pointer; margin-top:4px;
    }
    .login-btn:hover { background: var(--btn-primary-hover); }
    .hint { font-size:12px; color:var(--color-muted); margin: 0 0 8px; text-align:center; }
  </style>
  </head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">J</div>
        <div>
          <h1 class="login-title">Welcome to Jeen Insights</h1>
          <p class="login-subtitle">Create the first administrator account</p>
        </div>
      </div>

      {% if error %}
      <div class="login-error" role="alert">{{ error }}</div>
      {% endif %}

      <p class="hint">No admin account exists yet. This one-time screen creates it.
         Enter the setup token printed in the server logs (or your
         <code>SETUP_BOOTSTRAP_TOKEN</code>) to continue.</p>

      <form class="login-form" method="POST" action="/setup">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="login-field">
          <label class="login-label" for="setup_token">Setup token</label>
          <input id="setup_token" name="setup_token" type="password" class="login-input" required autofocus
                 autocomplete="off">
        </div>
        <div class="login-field">
          <label class="login-label" for="name">Full name</label>
          <input id="name" name="name" type="text" class="login-input" required
                 value="{{ request.form.get('name', '') }}">
        </div>
        <div class="login-field">
          <label class="login-label" for="email">Email</label>
          <input id="email" name="email" type="email" class="login-input" required
                 autocomplete="username" value="{{ request.form.get('email', '') }}">
        </div>
        <div class="login-field">
          <label class="login-label" for="password">Password (min 12 characters)</label>
          <input id="password" name="password" type="password" class="login-input" required
                 autocomplete="new-password" minlength="12">
        </div>
        <div class="login-field">
          <label class="login-label" for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" class="login-input" required
                 autocomplete="new-password" minlength="12">
        </div>
        <button type="submit" class="login-btn">Create admin & continue</button>
      </form>
    </div>
  </div>
</body>
</html>
