<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', stored || 'light');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First-run setup — Jeen Insights</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=41">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--color-bg);
      font-family: var(--font-sans, 'Geist', system-ui, sans-serif);
      min-height: 100vh;
    }
    .login-wrap { width: 100%; max-width: 420px; padding: 24px 16px; }
    .login-card {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: 16px; padding: 40px 36px 36px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .login-brand { display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:24px; }
    .login-logo {
      width:48px; height:48px; border-radius:12px; background: oklch(52% 0.22 280);
      display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color:#fff;
    }
    .login-title { font-size:22px; font-weight:700; color:var(--color-text); margin:0; text-align:center; }
    .login-subtitle { font-size:13px; color:var(--color-muted); margin:4px 0 0; text-align:center; }
    .login-error {
      display:flex; align-items:center; gap:8px; background: var(--color-error-bg, #fff0f0);
      border:1px solid var(--color-error-border, #ffd5d5); border-radius:8px; padding:10px 12px;
      margin-bottom:20px; font-size:13px; color: var(--color-error, #c0392b);
    }
    .login-form { display:flex; flex-direction:column; gap:16px; }
    .login-field { display:flex; flex-direction:column; gap:6px; }
    .login-label { font-size:13px; font-weight:500; color:var(--color-text); }
    .login-input {
      width:100%; padding:10px 12px; font-size:14px; font-family:inherit; border:1px solid var(--color-border);
      border-radius:8px; background: var(--color-input-bg, var(--color-bg)); color:var(--color-text);
      outline:none; box-sizing:border-box;
    }
    .login-input:focus { border-color: oklch(52% 0.22 280); box-shadow: 0 0 0 3px oklch(52% 0.22 280 / 0.15); }
    .login-btn {
      width:100%; padding:11px; border:none; border-radius:8px; background: oklch(52% 0.22 280);
      color:#fff; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; margin-top:4px;
    }
    .login-btn:hover { background: oklch(46% 0.22 280); }
    .hint { font-size:12px; color:var(--color-muted); margin: 0 0 8px; text-align:center; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">J</div>
        <div>
          <h1 class="login-title">Welcome to Jeen Insights</h1>
          <p class="login-subtitle">Create the first administrator account</p>
        </div>
      </div>

      {% if error %}
      <div class="login-error" role="alert">{{ error }}</div>
      {% endif %}

      <p class="hint">No admin account exists yet. This one-time screen creates it.
         Enter the setup token printed in the server logs (or your
         <code>SETUP_BOOTSTRAP_TOKEN</code>) to continue.</p>

      <form class="login-form" method="POST" action="/setup">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="login-field">
          <label class="login-label" for="setup_token">Setup token</label>
          <input id="setup_token" name="setup_token" type="password" class="login-input" required autofocus
                 autocomplete="off">
        </div>
        <div class="login-field">
          <label class="login-label" for="name">Full name</label>
          <input id="name" name="name" type="text" class="login-input" required
                 value="{{ request.form.get('name', '') }}">
        </div>
        <div class="login-field">
          <label class="login-label" for="email">Email</label>
          <input id="email" name="email" type="email" class="login-input" required
                 autocomplete="username" value="{{ request.form.get('email', '') }}">
        </div>
        <div class="login-field">
          <label class="login-label" for="password">Password (min 12 characters)</label>
          <input id="password" name="password" type="password" class="login-input" required
                 autocomplete="new-password" minlength="12">
        </div>
        <div class="login-field">
          <label class="login-label" for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" class="login-input" required
                 autocomplete="new-password" minlength="12">
        </div>
        <button type="submit" class="login-btn">Create admin & continue</button>
      </form>
    </div>
  </div>
</body>
</html>
