apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jeen-insights-lower-secret-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: jeen-insights-example
  source:
    repoURL: https://git.example.invalid/platform/jeen-insight.git
    targetRevision: "1111111111111111111111111111111111111111"
    path: operator-owned/lower/secret-bootstrap
  destination:
    server: https://kubernetes.example.invalid
    namespace: jeen-insights-lower
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - FailOnSharedResource=true
