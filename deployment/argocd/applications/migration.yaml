apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jeen-insights-lower-migration
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: jeen-insights-example
  source:
    repoURL: https://git.example.invalid/platform/jeen-insight.git
    targetRevision: "1111111111111111111111111111111111111111"
    path: deployment/k8s_dev
    helm:
      releaseName: jeen-insights
      values: |
        global:
          existingSecret:
            name: jeen-insights-secrets
            optional: false
          externalSecrets:
            enabled: false
        jeen-insights-api:
          enabled: false
        jeen-insights-ui:
          enabled: false
        jeen-insights-analytics:
          enabled: false
        migration:
          enabled: true
          bundleId: release-20260925-1208-deadbee
          image:
            repository: registry.example.invalid/jeen-insights-api
            tag: release-20260925-1208-deadbee
            digest: ""
            pullPolicy: IfNotPresent
          existingSecret:
            name: jeen-insights-secrets
            optional: false
          ttlSecondsAfterFinished: null
  destination:
    server: https://kubernetes.example.invalid
    namespace: jeen-insights-lower
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - FailOnSharedResource=true
      - ApplyOutOfSyncOnly=true
