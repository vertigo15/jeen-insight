# OpenShift (air-gapped) overlay for the umbrella chart in deployment/k8s_dev.
#
# Differences from the AKS overlay: images come from the cluster's internal
# registry, the Secret is hand-created from secrets.env (no External Secrets),
# no UID is pinned (the restricted SCC assigns one), and the UI is exposed by a
# Route instead of an nginx Ingress.
#
# build-images.sh renders this into manifests.yaml, supplying the image
# repository (registry + namespace) and tag. To render by hand:
#
#   helm dependency build deployment/k8s_dev
#   helm template jeen-insights deployment/k8s_dev --namespace <ns> \
#     --values deployment/openshift/values.openshift.yaml \
#     --set-string jeen-insights-api.image.repository=image-registry.openshift-image-registry.svc:5000/<ns>/jeen-insights-api \
#     --set-string jeen-insights-ui.image.repository=image-registry.openshift-image-registry.svc:5000/<ns>/jeen-insights-ui \
#     --set-string jeen-insights-analytics.image.repository=image-registry.openshift-image-registry.svc:5000/<ns>/jeen-insights-analytics \
#     --set-string jeen-insights-api.image.tag=<tag> \
#     --set-string jeen-insights-ui.image.tag=<tag> \
#     --set-string jeen-insights-analytics.image.tag=<tag>
#
# Site-specific values to change before rendering (or edit the rendered
# ConfigMap/Route in manifests.yaml): jeen-insights-ui.env.PUBLIC_APP_URL and
# jeen-insights-ui.route.host.

global:
  environment: onprem
  cloudProvider: openshift
  commonLabels:
    app.kubernetes.io/part-of: jeen-insights
  # Created from secrets.env (README step 3); never rendered by the chart.
  existingSecret:
    name: jeen-insights-secrets
    optional: false
  externalSecrets:
    enabled: false
  # Single replica per component: Recreate avoids needing quota for two pods
  # of the same component during a rollout.
  strategy:
    type: Recreate
  # Shared by all three pods. Mirror of config.env.example.
  env:
    JEEN_DEV_MODE: "false"
    INTERNAL_AUTH_ENABLED: "true"
    LOG_LEVEL: INFO
    LOG_FORMAT: json
    HOME: /tmp
    MPLCONFIGDIR: /tmp/mpl
    METADATA_DB_SSL: "true"
    LLM_TIMEOUT_SECONDS: "120"
    LANGGRAPH_MAX_RETRIES: "3"
    DB_STATEMENT_TIMEOUT_MS: "30000"
    MAX_RESULT_ROWS: "10000"
    CONVERSATION_CONTEXT_TURNS: "5"
    CONVERSATION_PERSISTENCE_ENABLED: "true"

jeen-insights-api:
  enabled: true
  fullnameOverride: jeen-insights-api
  image:
    repository: image-registry.openshift-image-registry.svc:5000/jeen-insights/jeen-insights-api
    pullPolicy: IfNotPresent
  # Let the SCC choose the UID; the image is readable by any UID in GID 0.
  securityContext:
    runAsUser: null
    runAsGroup: null
  env:
    # Apply db/migrations/insights on every start (advisory-locked, idempotent),
    # so a deployment needs no separate migration step. Set to "false" and use
    # migrate-job.yaml if migrations must run under a different DB role.
    RUN_MIGRATIONS_ON_START: "true"
    ML_SKILLS_ENABLED: "true"
    ANALYSIS_RUNNER: sandbox
    ANALYSIS_SANDBOX_URL: http://jeen-insights-analytics:8100
    ANALYSIS_SANDBOX_AUDIENCE: jeen-insights-analytics
    ANALYSIS_TIMEOUT_SECONDS: "30"
    ANALYSIS_MEMORY_MB: "1024"
    ANALYSIS_MAX_SERIES_ROWS: "1500"
    ANALYSIS_MAX_ENTITY_ROWS: "50000"
    ANALYSIS_RUNS_PER_HOUR_PER_USER: "60"
    # Map tiles / geocoding need internet egress.
    OSM_MAPS_ENABLED: "false"
    OSM_SEAMARKS_ENABLED: "false"
    OSM_TERRAIN_ENABLED: "false"
    OSM_GEOCODER_PROVIDER: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  networkPolicy:
    enabled: false

jeen-insights-analytics:
  enabled: true
  fullnameOverride: jeen-insights-analytics
  image:
    repository: image-registry.openshift-image-registry.svc:5000/jeen-insights/jeen-insights-analytics
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: null
    runAsGroup: null
    fsGroup: null
  env:
    ANALYSIS_SANDBOX_AUDIENCE: jeen-insights-analytics
    ANALYSIS_TIMEOUT_SECONDS: "30"
    ANALYSIS_MEMORY_MB: "1024"
    ANALYSIS_MAX_SERIES_ROWS: "1500"
    ANALYSIS_MAX_CONCURRENT: "2"
  # Ingress only from the API pods, no egress at all (requires a CNI that
  # enforces NetworkPolicy; OVN-Kubernetes and OpenShift SDN both do).
  networkPolicy:
    enabled: true

jeen-insights-ui:
  enabled: true
  fullnameOverride: jeen-insights-ui
  image:
    repository: image-registry.openshift-image-registry.svc:5000/jeen-insights/jeen-insights-ui
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: null
    runAsGroup: null
  apiBaseUrl: http://jeen-insights-api:8000
  env:
    UI_PORT: "8501"
    SESSION_COOKIE_SECURE: "true"
    RATELIMIT_STORAGE_URI: memory://
    # Browser-facing URL: must equal the Route host below.
    PUBLIC_APP_URL: https://jeen-insights.apps.example.internal
    # Entra ID SSO is unreachable air-gapped; local accounts only.
    AZURE_AD_CLIENT_ID: ""
    AZURE_AD_TENANT_ID: ""
    AZURE_AD_REDIRECT_URI: ""
  ingress:
    enabled: false
  route:
    enabled: true
    # Blank: the router assigns jeen-insights-ui-<namespace>.<apps domain>.
    # Pin it so it matches PUBLIC_APP_URL.
    host: jeen-insights.apps.example.internal
    timeout: 360s
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  networkPolicy:
    enabled: false
