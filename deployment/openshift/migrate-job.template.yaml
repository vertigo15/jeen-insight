# Optional one-off schema migration Job. Not needed when the API runs with
# RUN_MIGRATIONS_ON_START=true (the overlay default); use it when migrations
# must run under a different DB role or outside the application pod.
#
# build-images.sh renders it to migrate-job.yaml by substituting __IMAGE__ /
# __TAG__; the Job name carries the tag so each release gets a fresh Job
# (completed Jobs are immutable).
#
#   oc -n <namespace> apply -f migrate-job.yaml
#   oc -n <namespace> wait --for=condition=complete job/jeen-insights-migrate-__TAG__ --timeout=5m
#   oc -n <namespace> logs job/jeen-insights-migrate-__TAG__
#
# Runs scripts/run_insights_migrations.py from the API image with the same
# Secret and ConfigMap as the API pod (both must exist first). Applies each
# db/migrations/insights/*.sql once, in order, tracked in
# insights_schema_migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: jeen-insights-migrate-__TAG__
  labels:
    app.kubernetes.io/name: jeen-insights-migrate
    app.kubernetes.io/part-of: jeen-insights
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jeen-insights-migrate
        app.kubernetes.io/part-of: jeen-insights
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
      containers:
        - name: migrate
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          # Bypasses the image entrypoint (which would otherwise also honour
          # RUN_MIGRATIONS_ON_START from the shared ConfigMap).
          command: ["python", "scripts/run_insights_migrations.py"]
          envFrom:
            - secretRef:
                name: jeen-insights-secrets
            - configMapRef:
                name: jeen-insights-api
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
