{{- if .Values.enabled }}
{{- $env := mergeOverwrite (deepCopy (default dict .Values.global.env)) (default dict .Values.env) }}
{{- $nodeSelector := default (default dict .Values.global.nodeSelector) .Values.nodeSelector }}
{{- $sc := default dict .Values.securityContext }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jeen-insights-analytics.serviceAccountName" . }}
  labels:
    {{- include "jeen-insights-analytics.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jeen-insights-analytics.fullname" . }}
  labels:
    {{- include "jeen-insights-analytics.labels" . | nindent 4 }}
data:
  {{- range $key, $value := $env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jeen-insights-analytics.fullname" . }}
  labels:
    {{- include "jeen-insights-analytics.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ default "ClusterIP" .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "jeen-insights-analytics.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jeen-insights-analytics.fullname" . }}
  labels:
    {{- include "jeen-insights-analytics.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    type: {{ .Values.global.strategy.type }}
    {{- if eq .Values.global.strategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.global.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "jeen-insights-analytics.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jeen-insights-analytics.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ toJson $env | sha256sum }}
        secrets.jeen.ai/version: {{ .Values.global.secretVersion | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "jeen-insights-analytics.serviceAccountName" . }}
      # No API-server credentials in the sandbox, ever.
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        {{- with $sc.runAsUser }}
        runAsUser: {{ . }}
        {{- end }}
        {{- with $sc.runAsGroup }}
        runAsGroup: {{ . }}
        {{- end }}
        {{- with $sc.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
      containers:
        - name: analytics
          image: {{ include "jeen-insights-analytics.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8100
              protocol: TCP
          env:
            # Only the sandbox-audience secret is projected — not the API
            # signing key, no DB, no LLM keys. A compromised sandbox can then
            # mint tokens only for itself.
            - name: INTERNAL_ANALYTICS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "jeen-insights-analytics.existingSecretName" . }}
                  key: INTERNAL_ANALYTICS_SECRET
                  optional: {{ include "jeen-insights-analytics.existingSecretOptional" . }}
            - name: JEEN_DEV_MODE
              value: "false"
          envFrom:
            - configMapRef:
                name: {{ include "jeen-insights-analytics.fullname" . }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            {{- with $sc.runAsUser }}
            runAsUser: {{ . }}
            {{- end }}
            {{- with $sc.runAsGroup }}
            runAsGroup: {{ . }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpSizeLimit }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "jeen-insights-analytics.fullname" . }}
  labels:
    {{- include "jeen-insights-analytics.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "jeen-insights-analytics.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Default-deny egress: the sandbox may answer the API and nothing else. No DNS
# rule on purpose — it has nothing to resolve.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "jeen-insights-analytics.fullname" . }}
  labels:
    {{- include "jeen-insights-analytics.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jeen-insights-analytics.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jeen-insights-api
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: http
  egress: []
{{- end }}
{{- end }}
