enabled: true

global:
  commonLabels: {}
  secretVersion: ""
  imagePullSecrets: []
  env: {}
  nodeSelector: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  existingSecret:
    name: jeen-insights-secrets
    optional: false

image:
  # Valid lint-only defaults. The umbrella's environment overlay supplies
  # the deployable image reference.
  repository: registry.invalid/jeen-insights-ui
  tag: "0.0.0"
  # When set, digest takes precedence over tag and renders repository@digest.
  digest: ""
  pullPolicy: IfNotPresent

# Blank/null fields inherit global.existingSecret.
existingSecret:
  name: ""
  optional: null

replicaCount: 1
podAnnotations: {}

serviceAccount:
  create: true
  annotations: {}

service:
  port: 8501
  # ClusterIP behind an Ingress/Route, or LoadBalancer on clusters that expose
  # apps directly (e.g. an internal Azure load balancer via annotations).
  type: ClusterIP
  annotations: {}
  # Optional fixed address for a LoadBalancer service.
  loadBalancerIP: ""

apiBaseUrl: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# OpenShift Route — use instead of ingress on OpenShift (route.openshift.io/v1).
route:
  enabled: false
  # Blank: the router assigns <name>-<namespace>.<apps domain>. Set it to the
  # host in PUBLIC_APP_URL so OAuth redirects and cookies match.
  host: ""
  # haproxy.router.openshift.io/timeout; must exceed the longest SSE response.
  timeout: 360s
  annotations: {}
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    # Optional PEM material. Blank = the router's default (wildcard) certificate.
    certificate: ""
    key: ""
    caCertificate: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Numeric IDs pinned on the container. Set a value to null to omit the field:
# OpenShift's restricted SCC assigns a UID from the project's range and rejects
# a pod that pins one outside it (the image tolerates any UID in GID 0).
securityContext:
  runAsUser: 10001
  runAsGroup: 10001

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  ingressNamespaces: []
  dnsNamespaces:
    - kube-system
  externalEgressCIDRs: []
  externalEgressPorts:
    - 443
    - 5432

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Extra pod volumes / container mounts, e.g. a ConfigMap holding the private-CA
# bundle of internal identity providers (see OIDC_CA_BUNDLE).
extraVolumes: []
extraVolumeMounts: []

env: {}
