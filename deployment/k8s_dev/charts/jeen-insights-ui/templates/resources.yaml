{{- if .Values.enabled }}
{{- $apiBaseUrl := default (printf "http://%s-jeen-insights-api:8000" .Release.Name) .Values.apiBaseUrl }}
{{- $env := mergeOverwrite (deepCopy (default dict .Values.global.env)) (dict "API_BASE_URL" $apiBaseUrl) (default dict .Values.env) }}
{{- $nodeSelector := default (default dict .Values.global.nodeSelector) .Values.nodeSelector }}
{{- $sc := default dict .Values.securityContext }}
{{- $route := default dict .Values.route }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jeen-insights-ui.serviceAccountName" . }}
  labels:
    {{- include "jeen-insights-ui.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jeen-insights-ui.fullname" . }}
  labels:
    {{- include "jeen-insights-ui.labels" . | nindent 4 }}
data:
  {{- range $key, $value := $env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jeen-insights-ui.fullname" . }}
  labels:
    {{- include "jeen-insights-ui.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ default "ClusterIP" .Values.service.type }}
  {{- if and (eq (default "ClusterIP" .Values.service.type) "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "jeen-insights-ui.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jeen-insights-ui.fullname" . }}
  labels:
    {{- include "jeen-insights-ui.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 2
  strategy:
    type: {{ .Values.global.strategy.type }}
    {{- if eq .Values.global.strategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.global.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "jeen-insights-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jeen-insights-ui.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ toJson $env | sha256sum }}
        secrets.jeen.ai/version: {{ .Values.global.secretVersion | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "jeen-insights-ui.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: {{ include "jeen-insights-ui.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "jeen-insights-ui.existingSecretName" . }}
                optional: {{ include "jeen-insights-ui.existingSecretOptional" . }}
            - configMapRef:
                name: {{ include "jeen-insights-ui.fullname" . }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            {{- with $sc.runAsUser }}
            runAsUser: {{ . }}
            {{- end }}
            {{- with $sc.runAsGroup }}
            runAsGroup: {{ . }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "jeen-insights-ui.fullname" . }}
  labels:
    {{- include "jeen-insights-ui.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "jeen-insights-ui.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- if $route.enabled }}
---
# OpenShift Route (the platform's ingress). TLS terminates at the router; the
# long timeout keeps the UI's streaming (SSE) insight responses open.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "jeen-insights-ui.fullname" . }}
  labels:
    {{- include "jeen-insights-ui.labels" . | nindent 4 }}
  annotations:
    haproxy.router.openshift.io/timeout: {{ default "360s" $route.timeout | quote }}
    {{- with $route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "jeen-insights-ui.fullname" . }}
    weight: 100
  port:
    targetPort: http
  {{- $tls := default dict $route.tls }}
  {{- if $tls.enabled }}
  tls:
    termination: {{ default "edge" $tls.termination }}
    insecureEdgeTerminationPolicy: {{ default "Redirect" $tls.insecureEdgeTerminationPolicy }}
    {{- with $tls.certificate }}
    certificate: |-
      {{- . | nindent 6 }}
    {{- end }}
    {{- with $tls.key }}
    key: |-
      {{- . | nindent 6 }}
    {{- end }}
    {{- with $tls.caCertificate }}
    caCertificate: |-
      {{- . | nindent 6 }}
    {{- end }}
  {{- end }}
  wildcardPolicy: None
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "jeen-insights-ui.fullname" . }}
  labels:
    {{- include "jeen-insights-ui.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "jeen-insights-ui.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "jeen-insights-ui.fullname" . }}
  labels:
    {{- include "jeen-insights-ui.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "jeen-insights-ui.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "jeen-insights-ui.fullname" . }}
  labels:
    {{- include "jeen-insights-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jeen-insights-ui.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range .Values.networkPolicy.ingressNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jeen-insights-api
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8000
    {{- range .Values.networkPolicy.dnsNamespaces }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.networkPolicy.externalEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        {{- range $.Values.networkPolicy.externalEgressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
