enabled: true

global:
  commonLabels: {}
  imagePullSecrets: []
  env: {}
  nodeSelector: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  existingSecret:
    name: jeen-insights-secrets
    optional: false

image:
  # Valid lint-only defaults. The umbrella's environment overlay supplies
  # the deployable image reference.
  repository: registry.invalid/jeen-insights-api
  tag: "0.0.0"
  pullPolicy: IfNotPresent

replicaCount: 1
podAnnotations: {}

serviceAccount:
  create: true
  annotations: {}

service:
  port: 8000

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Numeric IDs pinned on the container. Set a value to null to omit the field:
# OpenShift's restricted SCC assigns a UID from the project's range and rejects
# a pod that pins one outside it (the image tolerates any UID in GID 0).
securityContext:
  runAsUser: 10001
  runAsGroup: 10001

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  dnsNamespaces:
    - kube-system
  externalEgressCIDRs: []
  externalEgressPorts:
    - 443
    - 5432
  # Port of the jeen-insights-analytics sandbox the API may call.
  analyticsPort: 8100

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env: {}
