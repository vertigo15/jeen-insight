global:
  # Environment-specific values belong in values.aks-dev.yaml or a GitOps
  # overlay. This base file intentionally contains no environment identifiers.
  environment: ""
  cloudProvider: ""
  commonLabels:
    app.kubernetes.io/part-of: jeen-insights
  # Bump this operator-controlled value after rotating an externally managed
  # Secret to force workload pods to restart. Secret contents are never hashed.
  secretVersion: ""
  imagePullSecrets: []
  nodeSelector: {}
  env:
    LOG_LEVEL: INFO
    METADATA_DB_SSL: "true"
    JEEN_DEV_MODE: "false"
    INTERNAL_AUTH_ENABLED: "true"
    HOME: /tmp
    MPLCONFIGDIR: /tmp/mpl
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  existingSecret:
    # This Secret is created outside Helm or by the optional ExternalSecret.
    name: jeen-insights-secrets
    optional: false
  externalSecrets:
    enabled: false
    refreshInterval: 1h
    # Owner: External Secrets authors the whole Secret. Merge: it patches only the
    # mapped keys and leaves the rest of an externally managed Secret alone.
    creationPolicy: Owner
    secretStoreRef:
      name: ""
      kind: ClusterSecretStore
    # Kubernetes Secret key -> remote provider key.
    secretMappings: {}

# Explicit, operator-run schema migration Job. This is deliberately disabled
# by default and is not a Helm hook; render and apply it before the workloads.
migration:
  enabled: false
  image:
    repository: registry.invalid/jeen-insights-api
    tag: "0.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  # Immutable release/bundle identifier appended to the Job name. When enabled,
  # it must be a DNS-1123 label and the complete Job name must fit 63 characters.
  bundleId: ""
  backoffLimit: 0
  activeDeadlineSeconds: 900
  # Keep completed Jobs for GitOps/Argo visibility. Set an integer to opt in.
  ttlSecondsAfterFinished: null
  lockWaitSeconds: 120
  lockTimeout: 15s
  statementTimeout: 10min
  encryptMcpTokensBackfill: false
  existingSecret:
    # Blank inherits global.existingSecret.
    name: ""
    # null inherits global.existingSecret.optional.
    optional: null
  apiConfigMap:
    # Optional non-secret API configuration. Blank omits the reference.
    name: ""
    optional: true
  # Portable default: no UID/GID is pinned, so OpenShift restricted SCC may
  # assign them. AKS overlays may add runAsUser/runAsGroup/fsGroup here.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraEnv: []
  imagePullSecrets: []

jeen-insights-api:
  enabled: true
  image:
    # Non-deployable defaults keep lint/template deterministic. Overlays must
    # supply an immutable tag or digest from their registry.
    repository: registry.invalid/jeen-insights-api
    tag: "0.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  existingSecret:
    name: ""
    optional: null
  replicaCount: 1
  podAnnotations: {}
  serviceAccount:
    create: true
    annotations: {}
  service:
    port: 8000
    type: ClusterIP
    annotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  extraVolumes: []
  extraVolumeMounts: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false
    dnsNamespaces:
      - kube-system
    externalEgressCIDRs: []
    externalEgressPorts:
      - 443
      - 5432
    analyticsPort: 8100
  env:
    # ML skills: the sandbox is the only production runner. Keep the feature
    # off until the analytics image is deployed, then flip ML_SKILLS_ENABLED.
    ML_SKILLS_ENABLED: "false"
    ANALYSIS_RUNNER: sandbox
    ANALYSIS_SANDBOX_URL: http://jeen-insights-jeen-insights-analytics:8100

# ML-skills sandbox (see docs/ml_skills_handoff/README.md §7).
jeen-insights-analytics:
  enabled: false
  image:
    repository: registry.invalid/jeen-insights-analytics
    tag: "0.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  existingSecret:
    name: ""
    optional: null
  replicaCount: 1
  podAnnotations: {}
  serviceAccount:
    create: true
    annotations: {}
  service:
    port: 8100
    type: ClusterIP
    annotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  tmpSizeLimit: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  extraVolumes: []
  extraVolumeMounts: []
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: true
  env:
    ANALYSIS_SANDBOX_AUDIENCE: jeen-insights-analytics
    ANALYSIS_TIMEOUT_SECONDS: "30"
    ANALYSIS_MEMORY_MB: "1024"
    ANALYSIS_MAX_SERIES_ROWS: "1500"
    ANALYSIS_MAX_CONCURRENT: "2"

jeen-insights-ui:
  enabled: true
  image:
    repository: registry.invalid/jeen-insights-ui
    tag: "0.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  existingSecret:
    name: ""
    optional: null
  replicaCount: 1
  podAnnotations: {}
  serviceAccount:
    create: true
    annotations: {}
  service:
    port: 8501
    type: ClusterIP
    annotations: {}
  apiBaseUrl: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  route:
    enabled: false
    host: ""
    timeout: 360s
    annotations: {}
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  extraVolumes: []
  extraVolumeMounts: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false
    ingressNamespaces: []
    dnsNamespaces:
      - kube-system
    externalEgressCIDRs: []
    externalEgressPorts:
      - 443
      - 5432
  env: {}
