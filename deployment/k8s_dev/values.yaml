global:
  # Environment-specific values belong in values.aks-dev.yaml or a GitOps
  # overlay. This base file intentionally contains no environment identifiers.
  environment: ""
  cloudProvider: ""
  commonLabels:
    app.kubernetes.io/part-of: jeen-insights
  imagePullSecrets: []
  env:
    LOG_LEVEL: INFO
    METADATA_DB_SSL: "true"
    JEEN_DEV_MODE: "false"
    INTERNAL_AUTH_ENABLED: "true"
    HOME: /tmp
    MPLCONFIGDIR: /tmp/mpl
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  existingSecret:
    # This Secret is created outside Helm or by the optional ExternalSecret.
    name: jeen-insights-secrets
    optional: false
  externalSecrets:
    enabled: false
    refreshInterval: 1h
    # Owner: External Secrets authors the whole Secret. Merge: it patches only the
    # mapped keys and leaves the rest of an externally managed Secret alone.
    creationPolicy: Owner
    secretStoreRef:
      name: ""
      kind: ClusterSecretStore
    # Kubernetes Secret key -> remote provider key.
    secretMappings: {}

jeen-insights-api:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  podAnnotations: {}
  serviceAccount:
    create: true
    annotations: {}
  service:
    port: 8000
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false
    dnsNamespaces:
      - kube-system
    externalEgressCIDRs: []
    externalEgressPorts:
      - 443
      - 5432
    analyticsPort: 8100
  env:
    # ML skills: the sandbox is the only production runner. Keep the feature
    # off until the analytics image is deployed, then flip ML_SKILLS_ENABLED.
    ML_SKILLS_ENABLED: "false"
    ANALYSIS_RUNNER: sandbox
    ANALYSIS_SANDBOX_URL: http://jeen-insights-jeen-insights-analytics:8100

# ML-skills sandbox (see docs/ml_skills_handoff/README.md §7).
jeen-insights-analytics:
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  podAnnotations: {}
  serviceAccount:
    create: true
    annotations: {}
  service:
    port: 8100
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  tmpSizeLimit: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: true
  env:
    ANALYSIS_SANDBOX_AUDIENCE: jeen-insights-analytics
    ANALYSIS_TIMEOUT_SECONDS: "30"
    ANALYSIS_MEMORY_MB: "1024"
    ANALYSIS_MAX_SERIES_ROWS: "1500"
    ANALYSIS_MAX_CONCURRENT: "2"

jeen-insights-ui:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  podAnnotations: {}
  serviceAccount:
    create: true
    annotations: {}
  service:
    port: 8501
  apiBaseUrl: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false
    ingressNamespaces: []
    dnsNamespaces:
      - kube-system
    externalEgressCIDRs: []
    externalEgressPorts:
      - 443
      - 5432
  env: {}
