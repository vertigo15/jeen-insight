{{- if .Values.global.externalSecrets.enabled }}
{{- $mappings := required "global.externalSecrets.secretMappings is required when External Secrets is enabled" .Values.global.externalSecrets.secretMappings }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "jeen-insights.externalSecretName" . }}
  labels:
    app.kubernetes.io/part-of: jeen-insights
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.global.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "global.externalSecrets.secretStoreRef.name is required when External Secrets is enabled" .Values.global.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.global.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "jeen-insights.existingSecretName" . }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $remoteKey := $mappings }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $remoteKey }}
    {{- end }}
{{- end }}
