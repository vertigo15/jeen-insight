{{- $metrics := default dict .Values.global.metrics }}
{{- $podMonitor := default dict $metrics.podMonitor }}
{{- if and $metrics.enabled $podMonitor.enabled }}
# One PodMonitor for the API, UI and analytics pods of this release, for a
# Prometheus that discovers targets from PodMonitor objects rather than the
# prometheus.io/* pod annotations.
apiVersion: {{ $podMonitor.apiVersion }}
kind: PodMonitor
metadata:
  name: {{ printf "%s-jeen-insights" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/part-of: jeen-insights
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with $podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - jeen-insights-api
          - jeen-insights-ui
          - jeen-insights-analytics
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ $podMonitor.interval | default "30s" }}
{{- end }}
