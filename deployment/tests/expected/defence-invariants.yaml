  NetworkPolicy: 1
  SecretProviderClass: 1
  Service: 3
  ServiceAccount: 3
forbiddenKinds:
  - ExternalSecret
  - HorizontalPodAutoscaler
  - Ingress
  - PodDisruptionBudget
  - Route
deployments:
  jeen-insights-api:
    image: acrjeendefensedev30fff5c1.azurecr.io/jeen-insights/jeen-insights-api:validation
    strategy: Recreate
    nodeSelector:
      role: apps
  jeen-insights-ui:
