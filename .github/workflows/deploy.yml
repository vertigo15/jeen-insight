name: CI / Deploy to AKS Dev

on:
  push:
    branches: [main]
  workflow_dispatch:          # allows manual trigger from GitHub UI

env:
  API_IMAGE: jeen-insights-api
  UI_IMAGE:  jeen-insights-ui
  AKS_RESOURCE_GROUP: jeen-rg-dev-k8s
  AKS_CLUSTER_NAME: aks-jeen-dev-weu-001
  AKS_NAMESPACE: jeen-data
  HELM_RELEASE: jeen-insights
  DEV_URL: https://jeen-insights.dev.jeenai.app

jobs:
  # ────────────────────────────────────────────────────────────────────
  # 1. Run unit tests
  # ────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  # ────────────────────────────────────────────────────────────────────
  # 2. Build Docker images and push to ACR
  # ────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        id: tag
        run: echo "value=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # -- API image -------------------------------------------------------
      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # -- UI image --------------------------------------------------------
      - name: Build & push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.UI_IMAGE }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.UI_IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────
  # 3. Deploy to AKS development
  # ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS Dev
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: development
      url: https://jeen-insights.dev.jeenai.app
    concurrency:
      group: jeen-insights-aks-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.35.6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.19

      - name: Connect to AKS dev
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          admin: "false"
          use-kubelogin: "true"

      - name: Validate Helm release
        run: |
          helm dependency build deployment/k8s_dev
          helm lint --with-subcharts deployment/k8s_dev \
            --values deployment/k8s_dev/values.aks-dev.yaml \
            --set-string jeen-insights-api.image.tag=${{ needs.build-and-push.outputs.image-tag }} \
            --set-string jeen-insights-ui.image.tag=${{ needs.build-and-push.outputs.image-tag }}
          kubectl --namespace "${AKS_NAMESPACE}" wait \
            --for=condition=Ready \
            externalsecret/jeen-insights-secrets-external \
            --timeout=60s

      - name: Deploy Helm release
        run: |
          helm upgrade --install "${HELM_RELEASE}" deployment/k8s_dev \
            --namespace "${AKS_NAMESPACE}" \
            --values deployment/k8s_dev/values.aks-dev.yaml \
            --set-string jeen-insights-api.image.tag=${{ needs.build-and-push.outputs.image-tag }} \
            --set-string jeen-insights-ui.image.tag=${{ needs.build-and-push.outputs.image-tag }} \
            --atomic \
            --wait \
            --timeout 10m

      - name: Verify AKS dev rollout
        run: |
          API_DEPLOYMENT="${HELM_RELEASE}-jeen-insights-api"
          UI_DEPLOYMENT="${HELM_RELEASE}-jeen-insights-ui"
          EXPECTED_API="${{ secrets.ACR_LOGIN_SERVER }}/${API_IMAGE}:${{ needs.build-and-push.outputs.image-tag }}"
          EXPECTED_UI="${{ secrets.ACR_LOGIN_SERVER }}/${UI_IMAGE}:${{ needs.build-and-push.outputs.image-tag }}"

          kubectl --namespace "${AKS_NAMESPACE}" rollout status \
            deployment/"${API_DEPLOYMENT}" --timeout=5m
          kubectl --namespace "${AKS_NAMESPACE}" rollout status \
            deployment/"${UI_DEPLOYMENT}" --timeout=5m

          test "$(kubectl --namespace "${AKS_NAMESPACE}" get deployment "${API_DEPLOYMENT}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')" = "${EXPECTED_API}"
          test "$(kubectl --namespace "${AKS_NAMESPACE}" get deployment "${UI_DEPLOYMENT}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')" = "${EXPECTED_UI}"

          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 \
            "${DEV_URL}/health"
