  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"06921685-cb82-4086-8073-5a609c91ed36\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>\n@font-face{font-family:\"Outfit\";src:url(\"8a777bfe-8ad2-448b-a60c-af68144e6f78\") format(\"woff2\");font-style:normal;font-weight:300 500;font-display:swap}\n@font-face{font-family:\"Geist Mono\";src:url(\"42b074a2-0b7b-4649-baa3-6d8914b804bb\") format(\"woff2\");font-style:normal;font-weight:400 500;font-display:swap}\n*{box-sizing:border-box}\nbody{margin:0;background:#f6f6f7;color:#1f1f24;font-family:\"Outfit\",system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#8878c4;text-decoration:none}\na:hover{color:#7a5ea8}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:48px 24px 96px;display:flex;flex-direction:column;gap:56px\">\n\n<header style=\"display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px\">\n<div style=\"flex:1;min-width:280px\">\n<div style=\"color:#b8b8bf;font:11px 'Geist Mono',monospace;letter-spacing:.06em\">ML SKILLS IN CHAT<\u002Fdiv>\n<h1 style=\"margin:14px 0 0;font-size:clamp(30px,3.6vw,44px);font-weight:300;line-height:1.1;letter-spacing:-.03em\">Six states for running ML from a question.<\u002Fh1>\n<p style=\"max-width:66ch;margin:16px 0 0;color:#98989f;font-size:16px;font-weight:300;line-height:1.65\">The user asks in plain language. The agent resolves the ask to one named skill with explicit parameters, aggregates in SQL, runs the model on the aggregate, and returns a card that shows the method, the parameters and a validation number alongside the result. Every parameter on the card is editable and re-runnable without asking again.<\u002Fp>\n<\u002Fdiv>\n<a href=\"ML Skills Handoff.dc.html\" style=\"height:38px;display:inline-flex;align-items:center;padding:0 18px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;color:#1f1f24;font-size:14px\" style-hover=\"background:#f6f6f7;color:#1f1f24\">Skills handoff<\u002Fa>\n<\u002Fheader>\n\n<section style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px\">\n<span style=\"font:12px 'Geist Mono',monospace;color:#8878c4\">STATE 01<\u002Fspan>\n<h2 style=\"margin:0;font-size:24px;font-weight:400;letter-spacing:-.02em\">Routing — the question becomes a skill<\u002Fh2>\n<p style=\"margin:0;flex:1;min-width:260px;color:#98989f;font-size:14px;font-weight:300;line-height:1.6\">Ask stays plain. The resolved skill and its parameters appear as an editable chip before anything runs.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid #e9e9ec;border-radius:18px;overflow:hidden;background:#fff;display:flex\">\n<div style=\"width:56px;flex:0 0 56px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;border-right:1px solid #e9e9ec\"><img src=\"2a144c5e-ce2d-4f2e-ac12-85ceec5f769c\" alt=\"\" style=\"width:22px;height:22px;object-fit:contain\"><div style=\"width:22px;height:1px;background:#e9e9ec\"><\u002Fdiv><div style=\"width:30px;height:30px;border-radius:10px;background:#f2effb\"><\u002Fdiv><div style=\"width:30px;height:30px;border-radius:10px;background:#f6f6f7\"><\u002Fdiv><div style=\"width:30px;height:30px;border-radius:10px;background:#f6f6f7\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n<div style=\"height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #e9e9ec\"><div style=\"height:28px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid #e9e9ec;border-radius:9999px;font-size:13px;color:#98989f\"><span style=\"width:7px;height:7px;border-radius:50%;background:#2f9e6d\"><\u002Fspan>AdventureWorksDW<\u002Fdiv><div style=\"height:24px;display:inline-flex;align-items:center;padding:0 10px;border-radius:9999px;background:#f2effb;color:#7a5ea8;font:10.5px 'Geist Mono',monospace\">AGGREGATE · 26 ROWS OUT<\u002Fdiv><div style=\"margin-left:auto;width:28px;height:28px;border-radius:50%;background:#7a5ea8\"><\u002Fdiv><\u002Fdiv>\n<div style=\"padding:26px 26px 22px;display:flex;flex-direction:column;gap:18px;min-width:0\">\n<div style=\"align-self:flex-end;max-width:70%;padding:12px 16px;border-radius:16px 16px 4px 16px;background:#1f1f24;color:#fff;font-size:14.5px;font-weight:300;line-height:1.5\">Is anything weird in profit over the last six months?<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;max-width:760px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><img src=\"2a144c5e-ce2d-4f2e-ac12-85ceec5f769c\" alt=\"\" style=\"width:18px;height:18px;object-fit:contain\"><span style=\"color:#98989f;font-size:13px\">Reading this as an anomaly check. Confirm or adjust before I run it.<\u002Fspan><\u002Fdiv>\n<div style=\"padding:16px 18px;border:1px solid #e0dcf0;border-radius:16px;background:#faf9fe\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n<span style=\"height:28px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:9999px;background:#8878c4;color:#fff;font:11.5px 'Geist Mono',monospace\">ANOMALY_DETECTION<\u002Fspan>\n<span style=\"color:#b8b8bf;font-size:13px\">on<\u002Fspan>\n<span style=\"height:28px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;font-size:13px\">SUM(Profit)<span style=\"margin-left:6px;color:#b8b8bf\">⌄<\u002Fspan><\u002Fspan>\n<span style=\"height:28px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;font-size:13px\">weekly<span style=\"margin-left:6px;color:#b8b8bf\">⌄<\u002Fspan><\u002Fspan>\n<span style=\"height:28px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;font-size:13px\">last 26 weeks<span style=\"margin-left:6px;color:#b8b8bf\">⌄<\u002Fspan><\u002Fspan>\n<span style=\"height:28px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;font-size:13px\">sensitivity 0.95<span style=\"margin-left:6px;color:#b8b8bf\">⌄<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:14px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.6\">SQL rolls profit up to 26 weekly points on the connection; only those 26 rows leave the database. Enough history for a weekly seasonal model.<\u002Fp><p style=\"margin:8px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.6\">No raw order rows are read.<\u002Fp>\n<div style=\"margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n<span style=\"height:34px;display:inline-flex;align-items:center;padding:0 18px;border-radius:9999px;background:#1f1f24;color:#fff;font-size:14px\">Run<\u002Fspan>\n<span style=\"height:34px;display:inline-flex;align-items:center;padding:0 14px;border-radius:9999px;border:1px solid #d8d8dd;background:#fff;font-size:13.5px;color:#1f1f24\">Use a different skill<\u002Fspan>\n<span style=\"margin-left:auto;color:#b8b8bf;font:11px 'Geist Mono',monospace\">~4s EST<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px\">\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">WHY CONFIRM<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">ML runs cost money and minutes. One confirm step turns a guess into a contract the user agreed to.<\u002Fp><\u002Fdiv>\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">EVERY CHIP EDITABLE<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">Measure, grain, window, sensitivity. The chip row is the parameter form — no separate dialog.<\u002Fp><\u002Fdiv>\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">SKIP ON REPEAT<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">After the first confirmed run per skill, later asks run straight through with the chip shown on the result instead.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px\">\n<span style=\"font:12px 'Geist Mono',monospace;color:#8878c4\">STATE 02<\u002Fspan>\n<h2 style=\"margin:0;font-size:24px;font-weight:400;letter-spacing:-.02em\">Anomaly detection — the result card<\u002Fh2>\n<p style=\"margin:0;flex:1;min-width:260px;color:#98989f;font-size:14px;font-weight:300;line-height:1.6\">Expected band, flagged points, a method strip, and the contributing features underneath.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid #e9e9ec;border-radius:18px;overflow:hidden;background:#fff;display:flex\">\n<div style=\"width:56px;flex:0 0 56px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;border-right:1px solid #e9e9ec\"><img src=\"2a144c5e-ce2d-4f2e-ac12-85ceec5f769c\" alt=\"\" style=\"width:22px;height:22px;object-fit:contain\"><div style=\"width:22px;height:1px;background:#e9e9ec\"><\u002Fdiv><div style=\"width:30px;height:30px;border-radius:10px;background:#f2effb\"><\u002Fdiv><div style=\"width:30px;height:30px;border-radius:10px;background:#f6f6f7\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n<div style=\"height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #e9e9ec\"><div style=\"height:28px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid #e9e9ec;border-radius:9999px;font-size:13px;color:#98989f\"><span style=\"width:7px;height:7px;border-radius:50%;background:#2f9e6d\"><\u002Fspan>AdventureWorksDW<\u002Fdiv><div style=\"margin-left:auto;width:28px;height:28px;border-radius:50%;background:#7a5ea8\"><\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px 26px 28px;min-width:0\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px\">\n<div style=\"flex:1;min-width:240px\">\n<div style=\"font-size:22px;font-weight:400;letter-spacing:-.02em;line-height:1.3\">Three weeks fall outside the expected range.<\u002Fdiv>\n<p style=\"margin:8px 0 0;max-width:64ch;color:#98989f;font-size:14px;font-weight:300;line-height:1.6\">Weekly profit was inside its predicted interval for 23 of 26 weeks. Week of 18 Feb came in 24% below expectation, week of 22 Apr 31% above, and week of 3 Jun 19% below.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<span style=\"height:30px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;font-size:12.5px\">Pin<\u002Fspan>\n<span style=\"height:30px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;font-size:12.5px\">Export<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:20px;border:1px solid #e9e9ec;border-radius:16px;overflow:hidden\">\n<div style=\"padding:14px 16px 4px;display:flex;flex-wrap:wrap;align-items:center;gap:16px\">\n<span style=\"display:inline-flex;align-items:center;gap:7px;color:#98989f;font-size:12px\"><span style=\"width:14px;height:2px;background:#1f1f24\"><\u002Fspan>Actual<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:7px;color:#98989f;font-size:12px\"><span style=\"width:14px;height:2px;background:#8878c4\"><\u002Fspan>Expected<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:7px;color:#98989f;font-size:12px\"><span style=\"width:14px;height:10px;border-radius:2px;background:#ece8f8\"><\u002Fspan>95% interval<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:7px;color:#98989f;font-size:12px\"><span style=\"width:9px;height:9px;border-radius:50%;background:#d4574a\"><\u002Fspan>Flagged<\u002Fspan>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 806 226\" style=\"display:block;width:100%;height:auto\">\n<g stroke=\"#f0f0f2\" stroke-width=\"1\"><line x1=\"44\" y1=\"196\" x2=\"762\" y2=\"196\"><\u002Fline><line x1=\"44\" y1=\"150\" x2=\"762\" y2=\"150\"><\u002Fline><line x1=\"44\" y1=\"104\" x2=\"762\" y2=\"104\"><\u002Fline><line x1=\"44\" y1=\"58\" x2=\"762\" y2=\"58\"><\u002Fline><line x1=\"44\" y1=\"16\" x2=\"762\" y2=\"16\"><\u002Fline><\u002Fg>\n<g fill=\"#b8b8bf\" font-family=\"Geist Mono, monospace\" font-size=\"9.5\"><text x=\"8\" y=\"199\">60k<\u002Ftext><text x=\"8\" y=\"107\">140k<\u002Ftext><text x=\"8\" y=\"19\">220k<\u002Ftext><\u002Fg>\n<path d=\"M44.0,116.1 L72.7,110.4 L101.4,105.4 L130.2,101.9 L158.9,100.1 L187.6,100.0 L216.3,101.1 L245.0,102.7 L273.8,103.9 L302.5,104.1 L331.2,102.6 L359.9,99.4 L388.6,94.7 L417.4,89.1 L446.1,83.3 L474.8,78.1 L503.5,74.3 L532.2,72.1 L561.0,71.7 L589.7,72.6 L618.4,74.2 L647.1,75.5 L675.8,75.9 L704.6,74.8 L733.3,72.0 L762.0,67.5 L762.0,96.8 L733.3,101.2 L704.6,104.1 L675.8,105.2 L647.1,104.8 L618.4,103.4 L589.7,101.9 L561.0,101.0 L532.2,101.4 L503.5,103.5 L474.8,107.3 L446.1,112.5 L417.4,118.3 L388.6,124.0 L359.9,128.7 L331.2,131.9 L302.5,133.3 L273.8,133.2 L245.0,131.9 L216.3,130.3 L187.6,129.3 L158.9,129.4 L130.2,131.2 L101.4,134.7 L72.7,139.6 L44.0,145.4 Z\" fill=\"#ece8f8\"><\u002Fpath>\n<polyline points=\"44.0,130.8 72.7,125.0 101.4,120.1 130.2,116.5 158.9,114.8 187.6,114.6 216.3,115.7 245.0,117.3 273.8,118.5 302.5,118.7 331.2,117.2 359.9,114.0 388.6,109.3 417.4,103.7 446.1,97.9 474.8,92.7 503.5,88.9 532.2,86.8 561.0,86.3 589.7,87.2 618.4,88.8 647.1,90.1 675.8,90.6 704.6,89.5 733.3,86.6 762.0,82.2\" fill=\"none\" stroke=\"#8878c4\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"><\u002Fpolyline>\n<polyline points=\"44.0,139.8 72.7,126.8 101.4,114.7 130.2,123.7 158.9,114.8 187.6,107.4 216.3,121.1 245.0,152.2 273.8,109.5 302.5,122.3 331.2,113.6 359.9,123.0 388.6,111.1 417.4,98.3 446.1,105.1 474.8,92.7 503.5,46.1 532.2,92.2 561.0,84.5 589.7,78.2 618.4,92.4 647.1,86.5 675.8,120.9 704.6,91.3 733.3,81.2 762.0,89.4\" fill=\"none\" stroke=\"#1f1f24\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpolyline>\n<g><circle cx=\"245.0\" cy=\"152.2\" r=\"5.5\" fill=\"#fff\" stroke=\"#d4574a\" stroke-width=\"2.2\"><\u002Fcircle><circle cx=\"503.5\" cy=\"46.1\" r=\"5.5\" fill=\"#fff\" stroke=\"#d4574a\" stroke-width=\"2.2\"><\u002Fcircle><circle cx=\"675.8\" cy=\"120.9\" r=\"5.5\" fill=\"#fff\" stroke=\"#d4574a\" stroke-width=\"2.2\"><\u002Fcircle><\u002Fg>\n<g fill=\"#98989f\" font-family=\"Outfit, sans-serif\" font-size=\"10.5\"><text x=\"30\" y=\"216\">7 Jan<\u002Ftext><text x=\"198\" y=\"216\">18 Feb<\u002Ftext><text x=\"372\" y=\"216\">1 Apr<\u002Ftext><text x=\"544\" y=\"216\">13 May<\u002Ftext><text x=\"730\" y=\"216\">1 Jul<\u002Ftext><\u002Fg>\n<\u002Fsvg>\n<\u002Fdiv>\n\n<sc-if value=\"{{ showMethodStrip }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:0;border:1px solid #e9e9ec;border-radius:14px;background:#fbfbfc;overflow:hidden\">\n<div style=\"flex:1;min-width:150px;padding:12px 16px;border-right:1px solid #e9e9ec\"><div style=\"color:#b8b8bf;font:10px 'Geist Mono',monospace\">METHOD<\u002Fdiv><div style=\"margin-top:5px;font-size:13.5px\">Seasonal ARIMA, weekly<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:130px;padding:12px 16px;border-right:1px solid #e9e9ec\"><div style=\"color:#b8b8bf;font:10px 'Geist Mono',monospace\">ROWS OUT<\u002Fdiv><div style=\"margin-top:5px;font-size:13.5px\">26 weekly aggregates<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:120px;padding:12px 16px;border-right:1px solid #e9e9ec\"><div style=\"color:#b8b8bf;font:10px 'Geist Mono',monospace\">BACKTEST MAPE<\u002Fdiv><div style=\"margin-top:5px;font-size:13.5px\">6.4% <span style=\"color:#2f9e6d\">good<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:120px;padding:12px 16px;border-right:1px solid #e9e9ec\"><div style=\"color:#b8b8bf;font:10px 'Geist Mono',monospace\">HISTORY<\u002Fdiv><div style=\"margin-top:5px;font-size:13.5px\">26 of 104 wks min met<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:12px 16px;display:flex;gap:8px\"><span style=\"height:28px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;font-size:12.5px\">Why this method<\u002Fspan><span style=\"height:28px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;font-size:12.5px\">SQL<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n<div style=\"padding:16px 18px;border:1px solid #e9e9ec;border-radius:16px\">\n<div style=\"color:#b8b8bf;font:10.5px 'Geist Mono',monospace\">CONTRIBUTING FEATURES · 18 FEB<\u002Fdiv>\n<div style=\"margin-top:14px;display:flex;flex-direction:column;gap:11px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:112px;flex:0 0 112px;font-size:13px\">Product line<\u002Fspan><span style=\"flex:1;height:8px;border-radius:9999px;background:#f0f0f2;overflow:hidden\"><span style=\"display:block;width:74%;height:8px;border-radius:9999px;background:#8878c4\"><\u002Fspan><\u002Fspan><span style=\"width:34px;text-align:right;color:#98989f;font:11px 'Geist Mono',monospace\">.74<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:112px;flex:0 0 112px;font-size:13px\">Sales territory<\u002Fspan><span style=\"flex:1;height:8px;border-radius:9999px;background:#f0f0f2;overflow:hidden\"><span style=\"display:block;width:41%;height:8px;border-radius:9999px;background:#8878c4\"><\u002Fspan><\u002Fspan><span style=\"width:34px;text-align:right;color:#98989f;font:11px 'Geist Mono',monospace\">.41<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:112px;flex:0 0 112px;font-size:13px\">Discount band<\u002Fspan><span style=\"flex:1;height:8px;border-radius:9999px;background:#f0f0f2;overflow:hidden\"><span style=\"display:block;width:22%;height:8px;border-radius:9999px;background:#8878c4\"><\u002Fspan><\u002Fspan><span style=\"width:34px;text-align:right;color:#98989f;font:11px 'Geist Mono',monospace\">.22<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:14px 0 0;color:#98989f;font-size:12.5px;font-weight:300;line-height:1.55\">Mountain Bikes accounted for most of the shortfall. Ask a follow-up to break that week out by product.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:16px 18px;border:1px solid #e9e9ec;border-radius:16px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"color:#b8b8bf;font:10.5px 'Geist Mono',monospace\">FOLLOW UP<\u002Fdiv>\n<span style=\"padding:9px 14px;border:1px solid #e9e9ec;border-radius:9999px;font-size:13px;font-weight:300;color:#1f1f24\" style-hover=\"border-color:#8878c4;color:#7a5ea8\">Break 18 Feb out by product line<\u002Fspan>\n<span style=\"padding:9px 14px;border:1px solid #e9e9ec;border-radius:9999px;font-size:13px;font-weight:300;color:#1f1f24\" style-hover=\"border-color:#8878c4;color:#7a5ea8\">Was revenue anomalous in the same weeks?<\u002Fspan>\n<span style=\"padding:9px 14px;border:1px solid #e9e9ec;border-radius:9999px;font-size:13px;font-weight:300;color:#1f1f24\" style-hover=\"border-color:#8878c4;color:#7a5ea8\">Alert me when profit goes outside this band<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px\">\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">HEADLINE IS THE FINDING<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">Not \"anomaly detection complete\". The count and the dates come first; the method is secondary.<\u002Fp><\u002Fdiv>\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">VALIDATION IS VISIBLE<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">Backtest error and the history check sit on the card, not behind a link. This is what the BI vendors hide.<\u002Fp><\u002Fdiv>\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">DRIVERS, NOT JUST FLAGS<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">Contributing features answer the question the user actually has, which is why.<\u002Fp><\u002Fdiv>\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">ALERT AS A FOLLOW-UP<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">Turning a one-off run into a monitor is one tap from the result. That is the retention loop.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px\">\n<span style=\"font:12px 'Geist Mono',monospace;color:#8878c4\">STATE 03<\u002Fspan>\n<h2 style=\"margin:0;font-size:24px;font-weight:400;letter-spacing:-.02em\">Re-run — parameters open on the card<\u002Fh2>\n<p style=\"margin:0;flex:1;min-width:260px;color:#98989f;font-size:14px;font-weight:300;line-height:1.6\">Tapping any chip opens the parameter drawer in place. The chart dims, not disappears, and the previous run stays reachable.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid #e9e9ec;border-radius:18px;overflow:hidden;background:#fff;display:flex\">\n<div style=\"width:56px;flex:0 0 56px;border-right:1px solid #e9e9ec;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0\"><img src=\"2a144c5e-ce2d-4f2e-ac12-85ceec5f769c\" alt=\"\" style=\"width:22px;height:22px;object-fit:contain;opacity:.5\"><div style=\"width:22px;height:1px;background:#e9e9ec\"><\u002Fdiv><div style=\"width:30px;height:30px;border-radius:10px;background:#f6f6f7\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px)\">\n<div style=\"padding:24px 26px;border-right:1px solid #e9e9ec;min-width:0;opacity:.5;display:flex;flex-direction:column;justify-content:center\">\n<div style=\"font-size:20px;font-weight:400;letter-spacing:-.02em\">Three weeks fall outside the expected range.<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 806 226\" style=\"display:block;width:100%;height:auto;margin-top:16px\">\n<g stroke=\"#f0f0f2\" stroke-width=\"1\"><line x1=\"44\" y1=\"196\" x2=\"762\" y2=\"196\"><\u002Fline><line x1=\"44\" y1=\"104\" x2=\"762\" y2=\"104\"><\u002Fline><line x1=\"44\" y1=\"16\" x2=\"762\" y2=\"16\"><\u002Fline><\u002Fg>\n<path d=\"M44.0,116.1 L158.9,100.1 L273.8,103.9 L388.6,94.7 L503.5,74.3 L618.4,74.2 L762.0,67.5 L762.0,96.8 L618.4,103.4 L503.5,103.5 L388.6,124.0 L273.8,133.2 L158.9,129.4 L44.0,145.4 Z\" fill=\"#ece8f8\"><\u002Fpath>\n<polyline points=\"44.0,139.8 72.7,126.8 101.4,114.7 130.2,123.7 158.9,114.8 187.6,107.4 216.3,121.1 245.0,152.2 273.8,109.5 302.5,122.3 331.2,113.6 359.9,123.0 388.6,111.1 417.4,98.3 446.1,105.1 474.8,92.7 503.5,46.1 532.2,92.2 561.0,84.5 589.7,78.2 618.4,92.4 647.1,86.5 675.8,120.9 704.6,91.3 733.3,81.2 762.0,89.4\" fill=\"none\" stroke=\"#1f1f24\" stroke-width=\"2\"><\u002Fpolyline>\n<g><circle cx=\"245.0\" cy=\"152.2\" r=\"5.5\" fill=\"#fff\" stroke=\"#d4574a\" stroke-width=\"2.2\"><\u002Fcircle><circle cx=\"503.5\" cy=\"46.1\" r=\"5.5\" fill=\"#fff\" stroke=\"#d4574a\" stroke-width=\"2.2\"><\u002Fcircle><circle cx=\"675.8\" cy=\"120.9\" r=\"5.5\" fill=\"#fff\" stroke=\"#d4574a\" stroke-width=\"2.2\"><\u002Fcircle><\u002Fg>\n<\u002Fsvg>\n<\u002Fdiv>\n<div style=\"padding:22px;display:flex;flex-direction:column;gap:20px;background:#fbfbfc;min-width:0\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\"><span style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">ANOMALY_DETECTION<\u002Fspan><span style=\"color:#b8b8bf;font-size:16px\">×<\u002Fspan><\u002Fdiv>\n<div>\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\"><span style=\"font-size:13px\">Sensitivity<\u002Fspan><span style=\"font:11.5px 'Geist Mono',monospace;color:#98989f\">0.95<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top:12px;position:relative;height:4px;border-radius:9999px;background:#e9e9ec\"><span style=\"position:absolute;left:0;top:0;width:78%;height:4px;border-radius:9999px;background:#8878c4\"><\u002Fspan><span style=\"position:absolute;left:78%;top:-6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:2px solid #8878c4;box-shadow:0 2px 6px rgba(24,24,27,.14)\"><\u002Fspan><\u002Fdiv>\n<div style=\"margin-top:9px;display:flex;justify-content:space-between;color:#b8b8bf;font-size:11px\"><span>flags more<\u002Fspan><span>flags fewer<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:13px\">Grain<\u002Fdiv>\n<div style=\"margin-top:10px;display:flex;gap:4px;padding:3px;border-radius:9999px;background:#f0f0f2\"><span style=\"flex:1;height:28px;display:grid;place-items:center;border-radius:9999px;color:#98989f;font-size:12.5px\">Day<\u002Fspan><span style=\"flex:1;height:28px;display:grid;place-items:center;border-radius:9999px;background:#fff;color:#1f1f24;font-size:12.5px;box-shadow:0 1px 3px rgba(24,24,27,.1)\">Week<\u002Fspan><span style=\"flex:1;height:28px;display:grid;place-items:center;border-radius:9999px;color:#98989f;font-size:12.5px\">Month<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:13px\">Method<\u002Fdiv>\n<div style=\"margin-top:10px;display:flex;flex-direction:column;gap:7px\">\n<span style=\"display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #8878c4;border-radius:12px;background:#fff;font-size:12.5px\"><span style=\"width:12px;height:12px;border-radius:50%;border:3.5px solid #8878c4\"><\u002Fspan>Auto — seasonal ARIMA<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #e9e9ec;border-radius:12px;background:#fff;font-size:12.5px;color:#98989f\"><span style=\"width:12px;height:12px;border-radius:50%;border:1px solid #d8d8dd\"><\u002Fspan>3-sigma on residuals<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #e9e9ec;border-radius:12px;background:#fff;font-size:12.5px;color:#98989f\"><span style=\"width:12px;height:12px;border-radius:50%;border:1px solid #d8d8dd\"><\u002Fspan>Isolation Forest<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #e9e9ec;border-radius:12px;background:#fff;font-size:12.5px;color:#98989f\"><span style=\"width:12px;height:12px;border-radius:50%;border:1px solid #d8d8dd\"><\u002Fspan>Seasonal hybrid ESD<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:12px;background:#f2effb\"><span style=\"color:#7a5ea8;font-size:12.5px;font-weight:300;line-height:1.5\">All four run on the same 26 aggregates. 3-sigma ignores seasonality, so expect it to flag every December.<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top:auto;display:flex;align-items:center;gap:10px\">\n<span style=\"flex:1;height:36px;display:grid;place-items:center;border-radius:9999px;background:#1f1f24;color:#fff;font-size:14px\">Re-run<\u002Fspan>\n<span style=\"height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:9999px;border:1px solid #d8d8dd;background:#fff;font-size:13px\">Reset<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px\">\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">HIGHEST-VALUE INTERACTION<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">Re-running with a nudged parameter is what makes this feel like analysis instead of a slot machine.<\u002Fp><\u002Fdiv>\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">NAME THE TRADE-OFF<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">Picking a sandbox method tells the user data leaves the warehouse. Governance is a design surface, not a footnote.<\u002Fp><\u002Fdiv>\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">RE-RUN APPENDS<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">Each re-run posts a new card in the thread so the user can compare, and never loses the first result.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px\">\n<span style=\"font:12px 'Geist Mono',monospace;color:#8878c4\">STATE 04<\u002Fspan>\n<h2 style=\"margin:0;font-size:24px;font-weight:400;letter-spacing:-.02em\">Forecast — the same card shape<\u002Fh2>\n<p style=\"margin:0;flex:1;min-width:260px;color:#98989f;font-size:14px;font-weight:300;line-height:1.6\">One envelope across skills: finding, chart, method strip, follow-ups. Only the middle changes.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid #e9e9ec;border-radius:18px;background:#fff;padding:24px 26px 28px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n<span style=\"height:26px;display:inline-flex;align-items:center;padding:0 11px;border-radius:9999px;background:#8878c4;color:#fff;font:11px 'Geist Mono',monospace\">FORECAST<\u002Fspan>\n<span style=\"height:26px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid #e9e9ec;border-radius:9999px;font-size:12.5px\">SUM(SalesAmount)<\u002Fspan>\n<span style=\"height:26px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid #e9e9ec;border-radius:9999px;font-size:12.5px\">monthly<\u002Fspan>\n<span style=\"height:26px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid #e9e9ec;border-radius:9999px;font-size:12.5px\">horizon 8<\u002Fspan>\n<span style=\"height:26px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid #e9e9ec;border-radius:9999px;font-size:12.5px\">80% interval<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top:16px;font-size:22px;font-weight:400;letter-spacing:-.02em;line-height:1.3\">Sales are projected to reach 1.47M by February, up 22% on the last eight months.<\u002Fdiv>\n<p style=\"margin:8px 0 0;max-width:70ch;color:#98989f;font-size:14px;font-weight:300;line-height:1.6\">Growth holds but the interval widens sharply after November — by February the 80% range spans 1.19M to 1.74M. Treat anything past three periods as a direction, not a number.<\u002Fp>\n<svg sc-camel-view-box=\"0 0 806 226\" style=\"display:block;width:100%;height:auto;margin-top:18px\">\n<g stroke=\"#f0f0f2\" stroke-width=\"1\"><line x1=\"44\" y1=\"196\" x2=\"762\" y2=\"196\"><\u002Fline><line x1=\"44\" y1=\"150\" x2=\"762\" y2=\"150\"><\u002Fline><line x1=\"44\" y1=\"104\" x2=\"762\" y2=\"104\"><\u002Fline><line x1=\"44\" y1=\"58\" x2=\"762\" y2=\"58\"><\u002Fline><line x1=\"44\" y1=\"16\" x2=\"762\" y2=\"16\"><\u002Fline><\u002Fg>\n<g fill=\"#b8b8bf\" font-family=\"Geist Mono, monospace\" font-size=\"9.5\"><text x=\"4\" y=\"199\">600k<\u002Ftext><text x=\"4\" y=\"107\">1.1M<\u002Ftext><text x=\"4\" y=\"19\">1.7M<\u002Ftext><\u002Fg>\n<path d=\"M575.9,94.6 L602.4,81.3 L629.0,64.3 L655.6,46.1 L682.2,29.9 L708.8,18.0 L735.4,11.2 L762.0,8.9 L762.0,104.8 L735.4,96.0 L708.8,91.6 L682.2,92.4 L655.6,97.5 L629.0,104.5 L602.4,110.5 L575.9,112.6 Z\" fill=\"#ece8f8\"><\u002Fpath>\n<polyline points=\"44.0,156.7 70.6,144.5 97.2,135.2 123.8,130.7 150.4,131.3 177.0,135.6 203.6,141.0 230.1,144.4 256.7,143.5 283.3,137.3 309.9,126.8 336.5,114.2 363.1,102.6 389.7,94.7 416.3,91.9 442.9,93.9 469.5,98.9 496.1,104.0 522.7,106.2 549.3,103.6\" fill=\"none\" stroke=\"#1f1f24\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpolyline>\n<polyline points=\"549.3,103.6 575.9,103.6 602.4,95.9 629.0,84.4 655.6,71.8 682.2,61.2 708.8,54.8 735.4,53.6 762.0,56.9\" fill=\"none\" stroke=\"#8878c4\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fpolyline>\n<line x1=\"549.3\" y1=\"16\" x2=\"549.3\" y2=\"196\" stroke=\"#d8d8dd\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fline>\n<text x=\"556\" y=\"28\" fill=\"#98989f\" font-family=\"Outfit, sans-serif\" font-size=\"10.5\">forecast<\u002Ftext>\n<g fill=\"#98989f\" font-family=\"Outfit, sans-serif\" font-size=\"10.5\"><text x=\"32\" y=\"216\">Jul 24<\u002Ftext><text x=\"226\" y=\"216\">Jan 25<\u002Ftext><text x=\"420\" y=\"216\">Jul 25<\u002Ftext><text x=\"600\" y=\"216\">Nov 25<\u002Ftext><text x=\"726\" y=\"216\">Feb 26<\u002Ftext><\u002Fg>\n<\u002Fsvg>\n<sc-if value=\"{{ showMethodStrip }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:14px;display:flex;flex-wrap:wrap;border:1px solid #e9e9ec;border-radius:14px;background:#fbfbfc;overflow:hidden\">\n<div style=\"flex:1;min-width:150px;padding:12px 16px;border-right:1px solid #e9e9ec\"><div style=\"color:#b8b8bf;font:10px 'Geist Mono',monospace\">METHOD<\u002Fdiv><div style=\"margin-top:5px;font-size:13.5px\">AutoARIMA (statsforecast)<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:130px;padding:12px 16px;border-right:1px solid #e9e9ec\"><div style=\"color:#b8b8bf;font:10px 'Geist Mono',monospace\">ROWS OUT<\u002Fdiv><div style=\"margin-top:5px;font-size:13.5px\">20 monthly aggregates<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:150px;padding:12px 16px;border-right:1px solid #e9e9ec\"><div style=\"color:#b8b8bf;font:10px 'Geist Mono',monospace\">HOLDOUT MAPE<\u002Fdiv><div style=\"margin-top:5px;font-size:13.5px\">11.2% <span style=\"color:#98989f\">fair<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:140px;padding:12px 16px;border-right:1px solid #e9e9ec\"><div style=\"color:#b8b8bf;font:10px 'Geist Mono',monospace\">SEASONALITY<\u002Fdiv><div style=\"margin-top:5px;font-size:13.5px\">12-month, detected<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:12px 16px;display:flex;gap:8px\"><span style=\"height:28px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;font-size:12.5px\">Compare methods<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px\">\n<span style=\"font:12px 'Geist Mono',monospace;color:#8878c4\">STATE 05<\u002Fspan>\n<h2 style=\"margin:0;font-size:24px;font-weight:400;letter-spacing:-.02em\">Clustering — segments need naming, not plotting<\u002Fh2>\n<p style=\"margin:0;flex:1;min-width:260px;color:#98989f;font-size:14px;font-weight:300;line-height:1.6\">A scatter of k-means output is unreadable to a business user. The profile table is the answer; the plot is supporting evidence.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid #e9e9ec;border-radius:18px;background:#fff;padding:24px 26px 28px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n<span style=\"height:26px;display:inline-flex;align-items:center;padding:0 11px;border-radius:9999px;background:#8878c4;color:#fff;font:11px 'Geist Mono',monospace\">CLUSTERING<\u002Fspan>\n<span style=\"height:26px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid #e9e9ec;border-radius:9999px;font-size:12.5px\">DimCustomer<\u002Fspan>\n<span style=\"height:26px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid #e9e9ec;border-radius:9999px;font-size:12.5px\">k = 3<\u002Fspan>\n<span style=\"height:26px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid #e9e9ec;border-radius:9999px;font-size:12.5px\">recency · frequency · value<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top:16px;font-size:22px;font-weight:400;letter-spacing:-.02em;line-height:1.3\">Three customer segments, and one of them is 6% of buyers producing 31% of profit.<\u002Fdiv>\n<div style=\"margin-top:20px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"border:1px solid #e9e9ec;border-radius:16px;overflow:hidden\">\n<div style=\"padding:12px 16px;border-bottom:1px solid #e9e9ec;color:#b8 :flex;flex-wrap:wrap;align-items:center;gap:10px\">\n<span style=\"color:#b8b8bf;font:10px 'Geist Mono',monospace\">SILHOUETTE 0.61<\u002Fspan>\n<span style=\"color:#b8b8bf;font:10px 'Geist Mono',monospace\">k CHOSEN BY ELBOW<\u002Fspan>\n<span style=\"margin-left:auto;height:28px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d8d8dd;border-radius:9999px;background:#fff;font-size:12.5px\">Try k = 4<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-wrap:wrap;gap:10px\">\n<span style=\"padding:9px 14px;border:1px solid #e9e9ec;border-radius:9999px;font-size:13px;font-weight:300\" style-hover=\"border-color:#8878c4;color:#7a5ea8\">Write the high-value segment back as a table<\u002Fspan>\n<span style=\"padding:9px 14px;border:1px solid #e9e9ec;border-radius:9999px;font-size:13px;font-weight:300\" style-hover=\"border-color:#8878c4;color:#7a5ea8\">What do lapsed customers have in common?<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px\">\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">THE MODEL NAMES NOTHING<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">k-means returns cluster 0, 1, 2. The LLM's job is labelling them from their centroids — this is where it adds real value.<\u002Fp><\u002Fdiv>\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">WRITE-BACK<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">Segments are only useful if they leave the app. Materialising one as a table is the action that closes the loop.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px\">\n<span style=\"font:12px 'Geist Mono',monospace;color:#8878c4\">STATE 06<\u002Fspan>\n<h2 style=\"margin:0;font-size:24px;font-weight:400;letter-spacing:-.02em\">Guard — refusing well<\u002Fh2>\n<p style=\"margin:0;flex:1;min-width:260px;color:#98989f;font-size:14px;font-weight:300;line-height:1.6\">Not enough history, irregular grain, too many gaps. A real state, not an error toast. Every refusal offers the two things the user can actually do.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid #e9e9ec;border-radius:18px;background:#fff;padding:26px\">\n<div style=\"max-width:680px\">\n<div style=\"display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 11px;border-radius:9999px;background:#fdeeec;color:#d4574a;font:10.5px 'Geist Mono',monospace\">GUARD · INSUFFICIENT HISTORY<\u002Fdiv>\n<div style=\"margin-top:14px;font-size:21px;font-weight:400;letter-spacing:-.02em;line-height:1.35\">62 days of daily data. A weekly seasonal forecast needs 104.<\u002Fdiv>\n<p style=\"margin:10px 0 0;color:#98989f;font-size:14px;font-weight:300;line-height:1.65\">ProductInventory starts on 3 May, so a model fitted here would be extrapolating a trend it has seen once. I can still run it, but the interval will be wide enough to be useless for planning.<\u002Fp>\n<div style=\"margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px\">\n<div style=\"padding:16px;border:1px solid #d8d8dd;border-radius:14px\"><div style=\"font-size:14px\">Forecast on a monthly grain instead<\u002Fdiv><p style=\"margin:6px 0 0;color:#98989f;font-size:12.5px;font-weight:300;line-height:1.55\">Two months is still thin, but no seasonal term is fitted so the output is honest.<\u002Fp><span style=\"margin-top:12px;height:32px;display:inline-flex;align-items:center;padding:0 14px;border-radius:9999px;background:#1f1f24;color:#fff;font-size:13px\">Run monthly<\u002Fspan><\u002Fdiv>\n<div style=\"padding:16px;border:1px solid #e9e9ec;border-radius:14px\"><div style=\"font-size:14px\">Use a longer table<\u002Fdiv><p style=\"margin:6px 0 0;color:#98989f;font-size:12.5px;font-weight:300;line-height:1.55\">FactInternetSales covers 2005–2008 daily. Ask the same question there.<\u002Fp><span style=\"margin-top:12px;height:32px;display:inline-flex;align-items:center;padding:0 14px;border-radius:9999px;border:1px solid #d8d8dd;background:#fff;font-size:13px\">Switch table<\u002Fspan><\u002Fdiv>\n<div style=\"padding:16px;border:1px solid #e9e9ec;border-radius:14px\"><div style=\"font-size:14px\">Run it anyway<\u002Fdiv><p style=\"margin:6px 0 0;color:#98989f;font-size:12.5px;font-weight:300;line-height:1.55\">The card will carry a low-confidence flag that travels with it into exports and pins.<\u002Fp><span style=\"margin-top:12px;height:32px;display:inline-flex;align-items:center;padding:0 14px;border-radius:9999px;color:#98989f;font-size:13px\">Run anyway<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px\">\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">NEVER A DEAD END<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">A refusal that only says no teaches the user the feature is broken. Three exits, one recommended.<\u002Fp><\u002Fdiv>\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">FLAG TRAVELS<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">If they override, the low-confidence marker must survive pinning and export — otherwise it reaches a board deck naked.<\u002Fp><\u002Fdiv>\n<div style=\"padding:14px 16px;border-left:2px solid #8878c4;background:#fff;border-radius:0 12px 12px 0\"><div style=\"font:11px 'Geist Mono',monospace;color:#8878c4\">GUARDS ARE PER SKILL<\u002Fdiv><p style=\"margin:7px 0 0;color:#98989f;font-size:13px;font-weight:300;line-height:1.55\">Min history, regular grain, gap tolerance, cardinality for clustering. Declared in the skill contract, not in prompt text.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px\">\n<span style=\"font:12px 'Geist Mono',monospace;color:#8878c4\">REFERENCE<\u002Fspan>\n<h2 style=\"margin:0;font-size:24px;font-weight:400;letter-spacing:-.02em\">The skill catalog<\u002Fh2>\n<p style=\"margin:0;flex:1;min-width:260px;color:#98989f;font-size:14px;font-weight:300;line-height:1.6\">Six skills, each with a fixed signature and a declared egress profile. Four read aggregates; two need row-level data and are governed differently.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid #e9e9ec;border-radius:18px;background:#fff;overflow:hidden\">\n<div style=\"display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,1.3fr) minmax(150px,1fr) minmax(130px,.9fr);gap:0;padding:12px 18px;border-bottom:1px solid #e9e9ec;background:#fbfbfc;color:#b8b8bf;font:10.5px 'Geist Mono',monospace\">\n<span>SKILL<\u002Fspan><span>ASKS THAT ROUTE HERE<\u002Fspan><span>ENGINE<\u002Fspan><span>ROWS OUT<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{ skills }}\" as=\"s\" hint-placeholder-count=\"6\">\n<div style=\"display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,1.3fr) minmax(150px,1fr) minmax(130px,.9fr);gap:0;padding:15px 18px;border-bottom:1px solid #f0f0f2;align-items:baseline\">\n<span style=\"font:11.5px 'Geist Mono',monospace;color:#7a5ea8\">{{ s.name }}<\u002Fspan>\n<span style=\"font-size:13.5px;font-weight:300;color:#1f1f24;line-height:1.5\">{{ s.asks }}<\u002Fspan>\n<span style=\"font-size:13px;font-weight:300;color:#98989f;line-height:1.5\">{{ s.engine }}<\u002Fspan>\n<span style=\"font-size:13px;font-weight:300;color:#98989f;line-height:1.5\">{{ s.egress }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"padding:16px 18px;color:#98989f;font-size:13px;font-weight:300;line-height:1.6\">Postgres, Trino and SQL Server have no usable ML functions, so every skill runs in the sandbox. The design work is therefore in the aggregation step: four of the six skills only ever see a few dozen aggregate rows, which keeps egress defensible. Clustering and driver analysis are the two that genuinely pull row-level data — they need a row cap, an audit entry, and different copy in the confirm card.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showAnnotations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Review&quot;},&quot;showMethodStrip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Review&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showAnnotations: this.props.showAnnotations ?? true,\n      showMethodStrip: this.props.showMethodStrip ?? true,\n      skills: [\n        {name:\"ANOMALY_DETECTION\", asks:\"anything weird, unusual, spikes, outliers, unexpected drops\", engine:\"statsforecast MSTL residuals · PyOD · 3-sigma\", egress:\"26–365 aggregate points\"},\n        {name:\"FORECAST\", asks:\"what will X be, project, next quarter, run rate\", engine:\"statsforecast AutoARIMA / AutoETS\", egress:\"24–120 aggregate points\"},\n        {name:\"CHANGEPOINT\", asks:\"when did it change, did the trend break\", engine:\"ruptures · MSTL decomposition\", egress:\"26–365 aggregate points\"},\n        {name:\"CORRELATION\", asks:\"what moves with X, is A related to B\", engine:\"pandas / scipy with lag search\", egress:\"aggregate pairs\"},\n        {name:\"CLUSTERING\", asks:\"segment, group, types of customers, natural cohorts\", engine:\"scikit-learn KMeans · HDBSCAN\", egress:\"row-level — one row per entity, capped\"},\n        {name:\"DRIVER_ANALYSIS\", asks:\"why did X change, what explains the drop\", engine:\"gradient-boosted fit + SHAP\", egress:\"row-level — capped sample\"}\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
